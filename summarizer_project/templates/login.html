<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Summarization Tool</title>    
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?display=swap&family=Plus+Jakarta+Sans:wght@400;500;700;800"
    />    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="relative flex size-full min-h-screen flex-col bg-[#FFFFFF] group/design-root overflow-x-hidden" style='font-family: "Plus Jakarta Sans", sans-serif;'>
      <div class="layout-container flex h-full grow flex-col">
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#F4EFE6] px-10 py-3">
          <div class="flex items-center gap-4 text-[#1C160C]">
            <div class="size-4">
              <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z"
                  fill="currentColor"
                ></path>
              </svg>
            </div>
            <h2 class="text-[#1C160C] text-lg font-bold leading-tight tracking-[-0.015em]">Briefly</h2>
          </div>
          <div class="flex flex-1 justify-end gap-8">
            <div class="flex items-center gap-9">
              <a class="text-[#1C160C] text-sm font-medium leading-normal transition-all duration-200 hover:text-[#019863] hover:scale-110 transform" href="/">Home</a>
              <a class="text-[#1C160C] text-sm font-medium leading-normal transition-all duration-200 hover:text-[#019863] hover:scale-110 transform" href="/register">Register</a>
            </div>
          </div>
        </header>

        <main class="flex flex-1 items-center justify-center">
          <div class="w-full max-w-[512px] px-4 py-5">
            <h1 class="text-[#1C160C] tracking-light text-[32px] font-bold leading-tight text-center pb-3 pt-6">Login to your account</h1>
            <form id="login-form" class="space-y-3">
              <div class="flex flex-col">
                <input
                  id="username"
                  name="username"
                  placeholder="Username"
                  class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-[#1C160C] focus:outline-0 focus:ring-0 border border-[#E9DFCE] bg-[#FFFFFF] focus:border-[#E9DFCE] h-14 placeholder:text-[#A18249] p-[15px] text-base font-normal leading-normal"
                  required
                />
              </div>
              <div class="flex flex-col">
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Password"
                  class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-[#1C160C] focus:outline-0 focus:ring-0 border border-[#E9DFCE] bg-[#FFFFFF] focus:border-[#E9DFCE] h-14 placeholder:text-[#A18249] p-[15px] text-base font-normal leading-normal"
                  required
                />
              </div>
              <div class="pt-3">
                <button type="submit" class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 bg-[#019863] text-[#FFFFFF] text-base font-bold leading-normal tracking-[0.015em] transition-all duration-300 ease-in-out hover:bg-[#017a4f] hover:shadow-lg hover:scale-[1.02]">
                  <span class="truncate">Login</span>
                </button>
              </div>
            </form>
          </div>
        </main>

        <footer class="flex flex-col items-center">
          <p class="text-[#A18249] text-sm font-normal leading-normal pb-3 pt-1 text-center">
            <a href="/register" class="underline">Don't have an account? Register here</a>
          </p>
          <div class="flex max-w-[960px] flex-1 flex-col w-full">
            <footer class="flex flex-col gap-6 px-5 py-10 text-center @container">
              <div class="flex flex-wrap items-center justify-center gap-6 @[480px]:flex-row @[480px]:justify-around">
                <a href="#" class="text-[#A18249] text-base font-normal leading-normal min-w-40" id="privacyPolicy">Privacy Policy</a>
                <a href="#" class="text-[#A18249] text-base font-normal leading-normal min-w-40" id="termsOfService">Terms of Service</a>
                <a href="#" class="text-[#A18249] text-base font-normal leading-normal min-w-40" id="contactUs">Contact Us</a>
              </div>
              <p class="text-[#A18249] text-base font-normal leading-normal">&copy; 2024 Briefly. All Rights Reserved.</p>
            </footer>
          </div>
        </footer>
      </div>
    </div>

    <script>
    $(document).ready(function() {
        // Login form handler
        $('#login-form').submit(function(e) {
            e.preventDefault();
            $.ajax({
                url: '/login',
                method: 'POST',
                data: $(this).serialize(),
                success: function(response) {
                    if (response.success) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Login successful!',
                            text: 'Welcome back, ' + response.username + '!',
                            timer: 1500,
                            showConfirmButton: false
                        }).then(() => {
                            window.location.href = response.redirect;
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Login Failed',
                            text: response.message
                        });
                    }
                },
                error: function() {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Something went wrong!'
                    });
                }
            });
        });

        // Privacy Policy Modal
        $('#privacyPolicy').click(function(e) {
            e.preventDefault();
            Swal.fire({
                title: 'Privacy Policy',
                html: `
                    <div class="text-left">
                        <h3 class="font-bold mb-4">Your Privacy Matters</h3>
                        <p class="mb-3">At Briefly, we take your privacy seriously. This policy outlines how we collect, use, and protect your personal information.</p>
                        
                        <h4 class="font-bold mb-2">Data Collection</h4>
                        <p class="mb-3">We collect only necessary information required to provide our summarization services, including:</p>
                        <ul class="list-disc pl-5 mb-3">
                            <li>Account information</li>
                            <li>Usage data</li>
                            <li>Content you submit for summarization</li>
                        </ul>
                        
                        <h4 class="font-bold mb-2">Data Usage</h4>
                        <p class="mb-3">Your data is used solely for:</p>
                        <ul class="list-disc pl-5 mb-3">
                            <li>Providing our services</li>
                            <li>Improving user experience</li>
                            <li>Account management</li>
                        </ul>
                        
                        <h4 class="font-bold mb-2">Data Protection</h4>
                        <p class="mb-3">We employ industry-standard security measures to protect your information, including:</p>
                        <ul class="list-disc pl-5 mb-3">
                            <li>Encryption of sensitive data</li>
                            <li>Regular security audits</li>
                            <li>Secure data storage</li>
                        </ul>
                    </div>
                `,
                confirmButtonText: 'Close',
                confirmButtonColor: '#019863',
                width: '600px',
                customClass: {
                    container: 'privacy-modal',
                    popup: 'swal2-popup-custom',
                    content: 'text-left'
                }
            });
        });

        // Terms of Service Modal
        $('#termsOfService').click(function(e) {
            e.preventDefault();
            Swal.fire({
                title: 'Terms of Service',
                html: `
                    <div class="text-left">
                        <h3 class="font-bold mb-4">Terms of Use</h3>
                        <p class="mb-3">By using Briefly, you agree to these terms of service.</p>
                        
                        <h4 class="font-bold mb-2">Usage Guidelines</h4>
                        <ul class="list-disc pl-5 mb-3">
                            <li>Use the service responsibly and ethically</li>
                            <li>Respect intellectual property rights</li>
                            <li>Maintain account security</li>
                            <li>Do not abuse or misuse the service</li>
                        </ul>
                        
                        <h4 class="font-bold mb-2">Service Limitations</h4>
                        <p class="mb-3">We reserve the right to:</p>
                        <ul class="list-disc pl-5 mb-3">
                            <li>Modify or terminate services</li>
                            <li>Update pricing and features</li>
                            <li>Limit access for policy violations</li>
                        </ul>
                        
                        <h4 class="font-bold mb-2">User Responsibilities</h4>
                        <p class="mb-3">Users must:</p>
                        <ul class="list-disc pl-5 mb-3">
                            <li>Provide accurate information</li>
                            <li>Maintain account security</li>
                            <li>Report any security concerns</li>
                            <li>Comply with all applicable laws</li>
                        </ul>
                    </div>
                `,
                confirmButtonText: 'Close',
                confirmButtonColor: '#019863',
                width: '600px',
                customClass: {
                    container: 'terms-modal',
                    popup: 'swal2-popup-custom',
                    content: 'text-left'
                }
            });
        });

        // Contact Us Modal
        $('#contactUs').click(function(e) {
            e.preventDefault();
            Swal.fire({
                title: 'Contact Us',
                html: `
                    <div class="text-center">
                        <h3 class="font-bold mb-4">Get in Touch</h3>
                        <div class="mb-6">
                            <h4 class="font-bold mb-2">Phone Numbers</h4>
                            <p class="mb-2">
                                Customer Support:<br>
                                <a href="tel:+15551234567" class="text-[#019863] hover:underline">+1 (555) 123-4567</a>
                            </p>
                            <p class="mb-4">
                                Technical Support:<br>
                                <a href="tel:+15559876543" class="text-[#019863] hover:underline">+1 (555) 987-6543</a>
                            </p>
                        </div>
                        
                        <div class="mb-6">
                            <h4 class="font-bold mb-2">Email</h4>
                            <p>
                                <a href="mailto:support@briefly.com" class="text-[#019863] hover:underline">support@briefly.com</a>
                            </p>
                        </div>
                        
                        <div class="text-sm text-gray-600">
                            <p class="mb-2">Business Hours:</p>
                            <p class="mb-1">Monday - Friday: 9:00 AM - 6:00 PM EST</p>
                            <p>We typically respond within 24 hours</p>
                        </div>
                    </div>
                `,
                confirmButtonText: 'Close',
                confirmButtonColor: '#019863',
                width: '500px',
                customClass: {
                    container: 'contact-modal',
                    popup: 'swal2-popup-custom'
                }
            });
        });

        // Custom styles for SweetAlert modals
        const style = document.createElement('style');
        style.textContent = `
            .swal2-popup-custom {
                font-family: "Plus Jakarta Sans", sans-serif !important;
            }
            .swal2-title {
                color: #1C160C !important;
                font-size: 1.5rem !important;
                font-weight: 700 !important;
                padding: 1rem 0 !important;
            }
            .swal2-html-container {
                text-align: left !important;
                max-height: 70vh !important;
                overflow-y: auto !important;
            }
            .swal2-html-container::-webkit-scrollbar {
                width: 8px;
            }
            .swal2-html-container::-webkit-scrollbar-track {
                background: #f1f1f1;
                border-radius: 4px;
            }
            .swal2-html-container::-webkit-scrollbar-thumb {
                background: #888;
                border-radius: 4px;
            }
            .swal2-html-container::-webkit-scrollbar-thumb:hover {
                background: #555;
            }
            .swal2-confirm {
                padding: 0.5rem 2rem !important;
                font-weight: 600 !important;
            }
            .swal2-popup {
                border-radius: 1rem !important;
                padding: 2rem !important;
            }
        `;
        document.head.appendChild(style);
    });
    </script>
</body>
</html>
